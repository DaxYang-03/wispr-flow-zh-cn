name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run validate
      - name: Build universal launch shim
        run: clang -O2 -Wall -Wextra -Werror -mmacosx-version-min=13.5 -arch arm64 -arch x86_64 src/wispr-launch.c -o "$RUNNER_TEMP/wispr-launch"
      - name: Check launcher scripts
        run: |
          bash -n scripts/bootstrap.sh
          bash -n scripts/install-release.sh
          for file in scripts/launchers/*.command; do zsh -n "$file"; done
